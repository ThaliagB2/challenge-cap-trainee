name: Development Pipeline

on:
  push:
    branches: [development]
  workflow_dispatch:
    inputs:
      deploy_type:
        description: 'Choose action type'
        required: true
        default: 'build-only'
        type: choice
        options:
        - build-only
        - build-and-deploy

jobs:
  build:
    name: Build MTAR
    uses: ./.github/workflows/build-mtar.yml
    with:
      node_version: '22.x'
      artifact_name: 'mtar-dev'
      retention_days: 1

  deploy:
    name: Deploy to Development
    needs: build
    if: |
      (github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_type == 'build-and-deploy') ||
      (github.event_name == 'push' && (github.ref == 'refs/heads/development'))
    uses: ./.github/workflows/deploy-to-cf.yml
    with:
      environment: 'development'
      artifact_name: 'mtar-dev-${{ github.sha }}'
      cf_retries: 0
    secrets:
      cf_api_url: ${{ secrets.DEV_CF_API_URL }}
      cf_username: ${{ secrets.DEV_CF_USERNAME }}
      cf_password: ${{ secrets.DEV_CF_PASSWORD }}
      cf_space: ${{ secrets.DEV_CF_SPACE }}
      cf_org: ${{ secrets.DEV_CF_ORG }}

  summary:
    name: Pipeline Summary
    runs-on: ubuntu-latest
    needs: [build, deploy]
    if: always()
    steps:
    - name: Development Pipeline Summary
      run: |
        echo "DEVELOPMENT PIPELINE SUMMARY"
        echo "============================"
        echo "Environment: Development"
        echo "Branch: ${{ github.ref_name }}"
        echo "Triggered by: ${{ github.actor }}"
        echo "Timestamp: $(date -u)"
        echo ""
        
        # Build status
        if [ "${{ needs.build.result }}" = "success" ]; then
          echo "Build: SUCCESS"
        else
          echo "Build: FAILED"
        fi
        
        # Deploy status
        if [ "${{ needs.deploy.result }}" = "success" ]; then
          echo "Deploy: SUCCESS"
          echo "Development environment updated!"
        elif [ "${{ needs.deploy.result }}" = "skipped" ]; then
          echo "Deploy: SKIPPED (build-only or PR)"
        else
          echo "Deploy: FAILED"
        fi
        
        echo "📦 Artifact: mtar-dev-${{ github.sha }}"
