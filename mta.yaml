_schema-version: 3.3.0
ID: {{app-name}}
version: 0.0.1
description: "A simple CAP project."
parameters:
  enable-parallel-deployments: true
build-parameters:
  before-all:
    - builder: custom
      commands:
        - yarn
        - yarn build:cf

modules:
  - name: {{app-name}}-srv
    type: nodejs
    path: gen/{{app-name}}
    parameters:
      instances: 1
      buildpack: nodejs_buildpack
      memory: 256M
    build-parameters:
      builder: custom
      commands:
        - cp ../../{{app-name}}/.cdsrc.json .
        - node srv/src/main/scripts/replace-csn-source.js
    provides:
      - name: {{app-name}}-api
        properties:
          {{app-name}}-url: ${default-url}
    properties:
      OPTIMIZE_MEMORY: true
    requires:
      - name: {{app-name}}-db
      - name: {{app-name}}-dest-service
      - name: {{app-name}}-conn-service
      - name: {{app-name}}-uaa

  - name: {{app-name}}-db-deployer
    type: hdb
    path: gen/db
    build-parameters:
      ignore:
        - node_modules/
    parameters:
      buildpack: nodejs_buildpack
      memory: 256M
    requires:
      - name: {{app-name}}-db
        properties:
          TARGET_CONTAINER: '~{hdi-container-name}'

resources:
  - name: {{app-name}}-db
    type: com.sap.xs.hdi-container
    parameters:
      service: hana
      service-plan: hdi-shared
      config:
        schema: {{schema-name}}
        makeUniqueName: false
    properties:
      hdi-container-name: '${service-name}'
      hdi-service-name: ${service-name}

  - name: {{app-name}}-dest-service
    type: org.cloudfoundry.managed-service
    parameters:
      config:
        HTML5Runtime_enabled: false
        version: 1.0.0
      service: destination
      service-name: {{app-name}}-dest-service
      service-plan: lite

  - name: {{app-name}}-conn-service
    type: org.cloudfoundry.managed-service
    parameters:
      service-plan: lite
      service: connectivity

  - name: {{app-name}}-uaa
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security.json
      config:
        xsappname: {{app-name}}-${space}
        tenant-mode: dedicated
