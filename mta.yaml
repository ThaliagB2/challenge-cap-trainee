_schema-version: 3.3.0
ID: vet-clinic-service
version: 0.0.1
description: "A simple CAP project."
parameters:
  enable-parallel-deployments: true
build-parameters:
  before-all:
    - builder: custom
      commands:
        - yarn
        - yarn build:cf

modules:
  - name: vet-clinic-service-srv
    type: nodejs
    path: gen/vet-clinic-service
    parameters:
      instances: 1
      buildpack: nodejs_buildpack
      memory: 256M
    build-parameters:
      builder: custom
      commands:
        - cp ../../vet-clinic-service/.cdsrc.json .
        - node srv/src/main/scripts/replace-csn-source.js
    provides:
      - name: vet-clinic-service-api
        properties:
          vet-clinic-service-url: ${default-url}
    properties:
      OPTIMIZE_MEMORY: true
    requires:
      - name: vet-clinic-service-db
      - name: vet-clinic-service-dest-service
      - name: vet-clinic-service-conn-service
      - name: vet-clinic-service-uaa

  - name: vet-clinic-service-db-deployer
    type: hdb
    path: gen/db
    build-parameters:
      ignore:
        - node_modules/
    parameters:
      buildpack: nodejs_buildpack
      memory: 256M
    requires:
      - name: vet-clinic-service-db
        properties:
          TARGET_CONTAINER: '~{hdi-container-name}'

resources:
  - name: vet-clinic-service-db
    type: com.sap.xs.hdi-container
    parameters:
      service: hana
      service-plan: hdi-shared
      config:
        schema: VET_CLINIC_SCHEMA
        makeUniqueName: false
    properties:
      hdi-container-name: '${service-name}'
      hdi-service-name: ${service-name}

  - name: vet-clinic-service-dest-service
    type: org.cloudfoundry.managed-service
    parameters:
      config:
        HTML5Runtime_enabled: false
        version: 1.0.0
      service: destination
      service-name: vet-clinic-service-dest-service
      service-plan: lite

  - name: vet-clinic-service-conn-service
    type: org.cloudfoundry.managed-service
    parameters:
      service-plan: lite
      service: connectivity

  - name: vet-clinic-service-uaa
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security.json
      config:
        xsappname: vet-clinic-service-${space}
        tenant-mode: dedicated
